name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JRE via jdk4py
        run: |
          python3 -m venv /tmp/jvenv
          /tmp/jvenv/bin/pip install -q jdk4py
          JH=$(echo /tmp/jvenv/lib/python3.*/site-packages/jdk4py/java-runtime)
          echo "JH=$JH" >> $GITHUB_ENV
          echo "$JH/bin" >> $GITHUB_PATH
          $JH/bin/java -version

      - name: Download ECJ 3.46
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.plang-tools
          gh api repos/NorbertXYZ/eclipse-maven/git/blobs/ada8fbcad988cebd85f72ddee3a2e66b4a30be6d -H "Accept: application/vnd.github.raw" > ~/.plang-tools/ecj.jar
          ls -lh ~/.plang-tools/ecj.jar

      - name: Compile
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out
          $JH/bin/java -jar ~/.plang-tools/ecj.jar -nowarn -8 -encoding UTF-8 -d /tmp/out $(find src/main/java -name '*.java') tools/FuncTest.java
          echo "Compiled $(find /tmp/out -name '*.class' | wc -l) classes"

      - name: Run functional tests
        run: |
          $JH/bin/java -Djava.awt.headless=true -Dfile.encoding=UTF-8 -cp /tmp/out FuncTest

      - name: Build plang.jar
        run: |
          rm -rf build/classes && mkdir -p build/classes
          $JH/bin/java -jar ~/.plang-tools/ecj.jar -nowarn -8 -encoding UTF-8 -d build/classes $(find src/main/java -name '*.java')
          python3 << 'PY'
          import zipfile, os
          jar_path = "plang.jar"
          classes_dir = "build/classes"
          manifest = "Manifest-Version: 1.0\nMain-Class: hu.ppke.itk.plang.plang\n\n"
          with zipfile.ZipFile(jar_path, 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr("META-INF/MANIFEST.MF", manifest)
              for root, dirs, files in os.walk(classes_dir):
                  for f in files:
                      full = os.path.join(root, f)
                      rel = os.path.relpath(full, classes_dir)
                      z.write(full, rel)
          print("jar created")
          PY
          ls -lh plang.jar

      - name: Test from jar
        run: |
          $JH/bin/java -Djava.awt.headless=true -Dfile.encoding=UTF-8 -cp /tmp/out:plang.jar FuncTest
