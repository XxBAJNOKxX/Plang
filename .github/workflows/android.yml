name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK engedélyezése
        uses: android-actions/setup-android@v3

      - name: Fordítás (debug + release APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Debug APK műtermék feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release APK műtermék feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: APK-k feltöltése Release-be (közvetlen, zip nélküli letöltés)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release create "$TAG" \
            --title "PLanG Android – legfrissebb build" \
            --notes "Közvetlen letöltés (nem zip): app-debug.apk (telepítésre ez való) és app-release.apk. Minden pushnál frissül." \
            || true
          gh release upload "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk \
            --clobber
